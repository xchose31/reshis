<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Решись Авиа: прогноз продаж</title>
<style>
:root{--bg:#e9eef2;--paper:#fbfcfd;--ink:#12263a;--mute:#5b6b7a;--line:#cbd5dd;--acc:#0a7ea4;--acc-soft:#a9d3e2;--warn:#c4750a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b26;--paper:#16273a;--ink:#e6edf3;--mute:#93a4b4;--line:#2b3f54;--acc:#4cb8dc;--acc-soft:#245a70;--warn:#e0a040;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI","Helvetica Neue",Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,48px)}
header h1{margin:0;font-size:1.25rem}
main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:24px;padding:0 clamp(16px,4vw,48px) 48px;max-width:1180px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px}
.ticket{border-top:6px solid var(--acc)}
h2{margin:0 0 14px;font-size:1.05rem}
label{display:block;margin:12px 0 4px;font-size:.9rem;color:var(--mute)}
input,select{width:100%;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}
button{font:inherit;cursor:pointer;border:0;border-radius:4px;padding:11px 16px;background:var(--acc);color:#fff;font-weight:600;margin-top:16px;width:100%}
button.ghost{background:none;color:var(--acc);border:1px solid var(--acc);width:auto;margin:0;padding:6px 12px}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{margin:0;background:none;color:var(--mute);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hint{font-size:.85rem;color:var(--mute);margin:4px 0 0}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.num b{display:block;font-size:2.4rem;line-height:1.1}
.num span{color:var(--mute);font-size:.9rem}
.num.sold b{color:var(--acc)}
.note{padding:10px 12px;border-left:4px solid var(--warn);background:var(--bg);margin:0 0 16px;font-size:.92rem}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mute);font:12px "Segoe UI",Arial,sans-serif}
.empty{color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Решись Авиа</h1><div id="who" hidden><span id="uname"></span> <button class="ghost" id="logout">Выйти</button></div></header>
<main>
<section class="panel ticket" id="auth">
  <div class="tabs"><button id="tab-login" class="on" type="button">Вход</button><button id="tab-reg" type="button">Регистрация</button></div>
  <label for="u">Имя пользователя</label><input id="u" autocomplete="username">
  <label for="pw">Пароль (от 6 символов)</label><input id="pw" type="password" autocomplete="current-password">
  <button id="auth-go" type="button">Войти</button>
  <p class="err" id="auth-err" role="alert"></p>
</section>
<section class="panel ticket" id="tool" hidden>
  <h2>Параметры рейса</h2>
  <label for="orig">Откуда</label><select id="orig"></select>
  <label for="dest">Куда</label><select id="dest"></select>
  <label for="date">Дата вылета</label><input id="date" type="date">
  <label for="price">Цена билета, руб.</label><input id="price" type="number" min="0" step="50">
  <p class="hint" id="price-hint"></p>
  <button id="go" type="button">Рассчитать продажи</button>
  <p class="err" id="err" role="alert"></p>
</section>
<section class="panel" id="out" aria-live="polite">
  <p class="empty">Войдите и выберите рейс, дату и цену. Здесь появятся свободные места, прогноз продаж и график спроса.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let mode="login", meta=null, token=localStorage.getItem("token");

async function api(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",
    headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},
    body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&path==="/api/predict")logout();
  if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:"Проверьте введённые данные");
  return d;
}
function setMode(m){mode=m;$("tab-login").classList.toggle("on",m==="login");$("tab-reg").classList.toggle("on",m==="reg");
  $("auth-go").textContent=m==="login"?"Войти":"Создать аккаунт";$("auth-err").textContent="";}
$("tab-login").onclick=()=>setMode("login");$("tab-reg").onclick=()=>setMode("reg");
$("auth-go").onclick=async()=>{
  try{const d=await api(mode==="login"?"/api/login":"/api/register",{username:$("u").value.trim(),password:$("pw").value});
    token=d.token;localStorage.setItem("token",token);localStorage.setItem("user",d.username);show();}
  catch(e){$("auth-err").textContent=e.message;}};
function logout(){token=null;localStorage.removeItem("token");show();}
$("logout").onclick=logout;

async function show(){
  const on=!!token;$("auth").hidden=on;$("tool").hidden=!on;$("who").hidden=!on;
  $("uname").textContent=localStorage.getItem("user")||"";
  if(!on)return;
  if(!meta){meta=await api("/api/meta");
    const origins=[...new Set(meta.routes.map(r=>r.origin))];
    $("orig").innerHTML=origins.map(o=>`<option>${o}</option>`).join("");
    $("date").min=meta.date_min;$("date").max=meta.date_max;$("date").value=meta.date_min;
    $("orig").onchange=fillDest;$("dest").onchange=fillPrice;fillDest();}
}
function fillDest(){
  $("dest").innerHTML=meta.routes.filter(r=>r.origin===$("orig").value).map(r=>`<option>${r.destination}</option>`).join("");fillPrice();}
function fillPrice(){
  const r=meta.routes.find(r=>r.origin===$("orig").value&&r.destination===$("dest").value);
  $("price").value=r.base_price;$("price-hint").textContent=`Базовая цена ${r.base_price} руб., разумный диапазон ${r.price_min}–${r.price_max} руб.`;}

$("go").onclick=async()=>{
  $("err").textContent="";
  try{render(await api("/api/predict",{origin:$("orig").value,destination:$("dest").value,date:$("date").value,price:parseFloat($("price").value)}));}
  catch(e){$("err").textContent=e.message;}};

function chart(d){
  const W=620,H=300,L=46,R=12,T=16,B=44,n=d.scenarios.length;
  const max=Math.max(d.seats,...d.scenarios.map(s=>s.wish),1)*1.12;
  const y=v=>T+(H-T-B)*(1-Math.max(v,0)/max), bw=(W-L-R)/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Спрос по сценариям при цене ${d.price} руб.">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`;}
  d.scenarios.forEach((c,i)=>{
    const x=L+i*bw+bw*.14,w=bw*.72,med=c.quantile===0.5,over=c.wish>d.seats;
    const top=y(Math.min(c.wish,d.seats)),cap=y(c.wish);
    s+=`<rect x="${x}" y="${top}" width="${w}" height="${y(0)-top}" fill="${med?"var(--acc)":"var(--acc-soft)"}"/>`;
    if(over)s+=`<rect x="${x}" y="${cap}" width="${w}" height="${top-cap}" fill="var(--warn)" opacity=".55"/>`;
    s+=`<text x="${x+w/2}" y="${Math.min(cap,top)-4}" text-anchor="middle" style="fill:var(--ink)">${Math.round(c.wish)}</text>`;
    s+=`<text x="${x+w/2}" y="${H-24}" text-anchor="middle" ${med?'style="fill:var(--ink);font-weight:700"':""}>${Math.round(c.quantile*100)}%</text>`;});
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(d.seats)}" y2="${y(d.seats)}" stroke="var(--ink)" stroke-dasharray="6 4"/><text x="${W-R}" y="${y(d.seats)-5}" text-anchor="end" style="fill:var(--ink)">мест: ${d.seats}</text>`;
  return s+`<text x="${L+(W-L-R)/2}" y="${H-5}" text-anchor="middle">сценарий спроса (квантиль прогноза)</text></svg>`;}

function render(d){
  const warn=d.price<d.price_min||d.price>d.price_max
    ?`<p class="note">Цена ${d.price} руб. вне разумного диапазона для маршрута (${d.price_min}–${d.price_max} руб.), прогноз может быть неточным.</p>`:"";
  const full=d.wish>d.seats?`<p class="note">При такой цене желающих больше, чем мест: продажи упираются в вместимость самолёта.</p>`:"";
  $("out").innerHTML=`<h2>${d.origin} → ${d.destination}, ${d.date}</h2>${warn}${full}
  <div class="nums"><div class="num"><b>${d.seats}</b><span>мест в самолёте</span></div>
  <div class="num"><b>${Math.round(d.wish)}</b><span>желающих (медиана)</span></div>
  <div class="num sold"><b>${Math.round(d.sales)}</b><span>билетов купят</span></div></div>
  ${chart(d)}
  <p class="hint">Девять столбцов это сценарии спроса при введённой цене, от пессимистичного (10%) до оптимистичного (90%). Между соседними столбцами с вероятностью 10% окажется реальный спрос. Тёмный столбец это медиана, пунктир это число мест, оранжевая часть это спрос, который не поместится в самолёт.</p>`;}
show();
</script>
</body>
</html>
